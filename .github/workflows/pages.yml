name: Deploy interview demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend build dependencies without native backend hooks
        run: npm ci --ignore-scripts
      - name: Validate frontend
        run: |
          npm run test:demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:writing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:board
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:selection
          exit $LASTEXITCODE
      - name: Install browser for shared-feature regression
        run: npx playwright install --with-deps chromium
      - name: Build and verify full application
        run: |
          npm run db:generate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx prisma migrate deploy --schema packages/backend/prisma/schema.prisma
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/frontend/tests/featureParity.browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/frontend/tests/referenceCreation.browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/frontend/tests/characterBoard.browser.cjs
          exit $LASTEXITCODE
        env:
          DATABASE_URL: file:./ci-unused.db
          VITE_DEMO_MODE: 'false'
          VITE_BASE_PATH: /
          PARITY_MODE: full
      - name: Build public demo
        run: npm run build:frontend
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /noval-agent/
      - name: Verify same creative features in public demo
        run: |
          node packages/frontend/tests/featureParity.browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/frontend/tests/referenceCreation.browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/frontend/tests/characterBoard.browser.cjs
          exit $LASTEXITCODE
        env:
          PARITY_MODE: demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: packages/frontend/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
